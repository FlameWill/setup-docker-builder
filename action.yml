name: FlameWill Docker builder
description: docker/setup-buildx-action with a Docker layer cache on FlameWill runners. Builds find their layers already in the builder.
author: FlameWill
branding:
  icon: layers
  color: orange

# The cache inputs are FlameWill's; the rest are docker/setup-buildx-action's (v4.4.1), passed through. On a FlameWill runner the cache
# is the builder's own BuildKit state, restored before the builder starts: a build needs no cache-from or cache-to, its layers are
# already there. It needs BuildKit in a container (the docker-container driver). Elsewhere this is setup-buildx-action alone.
inputs:
  cache-key:
    description: Name of this build's layer cache. Builds with the same key share layers; use one key per image you build.
    default: default
  version:
    description: Buildx version, as in docker/setup-buildx-action.
  driver-opts:
    description: As in docker/setup-buildx-action.
  buildkitd-flags:
    description: As in docker/setup-buildx-action.
  buildkitd-config:
    description: As in docker/setup-buildx-action.
  buildkitd-config-inline:
    description: As in docker/setup-buildx-action.
  platforms:
    description: As in docker/setup-buildx-action.
  name:
    description: As in docker/setup-buildx-action. With FlameWill's cache on, the builder is named after the cache key instead.
  cleanup:
    description: As in docker/setup-buildx-action.
    default: true

outputs:
  cache-from:
    description: Always empty (the builder holds the cache); kept so workflows that pass it to docker/build-push-action keep working.
    value: ${{ steps.cache.outputs.cache-from }}
  cache-to:
    description: Always empty (a build of the default branch saves the builder's cache after the job); kept like cache-from.
    value: ${{ steps.cache.outputs.cache-to }}
  name:
    description: The builder's name.
    value: ${{ steps.buildx.outputs.name }}
  platforms:
    description: The builder's platforms.
    value: ${{ steps.buildx.outputs.platforms }}

runs:
  using: composite
  steps:
    - name: Docker layer cache
      id: cache
      shell: bash
      env:
        CACHE_KEY: ${{ inputs.cache-key }}
      run: |
        if command -v fw-buildkit-cache >/dev/null 2>&1; then
          fw-buildkit-cache "$CACHE_KEY"
        else
          printf 'builder=\ndriver-opts=\nkeep=false\ncache-from=\ncache-to=\n' >> "$GITHUB_OUTPUT"
        fi

    # the BuildKit image the cache was saved with (a state is reused only by the BuildKit that wrote it), then the workflow's own options
    - name: Builder options
      id: options
      shell: bash
      env:
        CACHE_OPTS: ${{ steps.cache.outputs.driver-opts }}
        OWN_OPTS: ${{ inputs.driver-opts }}
      run: |
        {
          echo 'driver-opts<<FLAMEWILL_EOF'
          [ -z "$CACHE_OPTS" ] || printf '%s\n' "$CACHE_OPTS"
          [ -z "$OWN_OPTS" ] || printf '%s\n' "$OWN_OPTS"
          echo 'FLAMEWILL_EOF'
        } >> "$GITHUB_OUTPUT"

    - name: Set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      with:
        version: ${{ inputs.version }}
        driver: docker-container
        driver-opts: ${{ steps.options.outputs.driver-opts }}
        buildkitd-flags: ${{ inputs.buildkitd-flags }}
        buildkitd-config: ${{ inputs.buildkitd-config }}
        buildkitd-config-inline: ${{ inputs.buildkitd-config-inline }}
        platforms: ${{ inputs.platforms }}
        name: ${{ steps.cache.outputs.builder || inputs.name }}
        # a build that saves the cache keeps its builder until the job's end, when FlameWill saves it (the machine is destroyed after)
        cleanup: ${{ steps.cache.outputs.keep != 'true' && inputs.cleanup }}
